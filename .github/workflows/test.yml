name: Run Ephemeral DSH Server

on:
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  run-dsh:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Install & Start DeepSeek Harness
        run: |
          npm install -g @deepseek-ai/dsh@latest
          # Start DSH server in the background on port 3080
          dsh web --port 3080 --no-open &
          sleep 5

      - name: 🌐 Expose via Cloudflare Tunnel
        run: |
          # Download and install cloudflared binary
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          # Start cloudflared and stream logs into tunnel.log in background
          cloudflared tunnel --url http://localhost:3080 > tunnel.log 2>&1 &

          # Wait for the trycloudflare URL to be generated
          echo "Waiting for Cloudflare URL..."
          sleep 8

          # Extract and print the exact URL
          URL=$(grep -o 'https://.*\.trycloudflare\.com' tunnel.log | head -n 1)

          echo "=================================================================="
          echo "🚀 YOUR DEEPSEEK HARNESS URL IS:"
          echo "👉 $URL"
          echo "=================================================================="

          # Also write it to the GitHub Step Summary UI tab
          echo "### 🚀 DeepSeek Harness Web URL" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open DeepSeek Harness]($URL)" >> $GITHUB_STEP_SUMMARY

          # Keep the process alive so the tunnel doesn't close immediately
          tail -f tunnel.log
          
