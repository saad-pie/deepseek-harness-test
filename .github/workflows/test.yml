name: Run Ephemeral DSH Server (ngrok)

on:
  workflow_dispatch: # Trigger manually from Actions tab

jobs:
  run-dsh:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Install & Start DeepSeek Harness
        run: |
          npm install -g @deepseek-ai/dsh@latest
          # Start DSH server in the background on port 3080
          dsh web --port 3080 --no-open &
          sleep 5

      - name: 🚀 Install & Launch ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. Download and install official ngrok CLI
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.repo | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

          # 2. Authenticate ngrok with your token
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # 3. Launch tunnel in background and log to file
          ngrok http 3080 --log=stdout > ngrok.log 2>&1 &
          
          echo "Waiting for ngrok tunnel to initialize..."
          sleep 5

          # 4. Extract generated https URL from ngrok API
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "=================================================================="
          echo "🚀 YOUR DEEPSEEK HARNESS URL IS:"
          echo "👉 $URL"
          echo "=================================================================="

          # 5. Output directly to the GitHub Actions Job Summary UI
          echo "### 🚀 DeepSeek Harness Web UI" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open DeepSeek Harness]($URL)" >> $GITHUB_STEP_SUMMARY

          # Keep runner alive to preserve the active session/tunnel
          tail -f ngrok.log
          
