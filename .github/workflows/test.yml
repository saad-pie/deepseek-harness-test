name: Run Ephemeral DSH Server (ngrok)

on:
  workflow_dispatch: # Trigger manually from Actions tab

jobs:
  run-dsh:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by dsh)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚡ Prepare Workspace & Start DeepSeek Harness
        run: |
          npm install -g @ngrok/ngrok@latest

          # Create workspace directory for dsh
          mkdir -p /home/runner/work/workspace

          # Start DSH in background with explicit workspace path
          npx --yes @deepseek-ai/dsh@latest web --port 3080 --workspace /home/runner/work/workspace --no-open > dsh.log 2>&1 &

          echo "Waiting for DeepSeek Harness to bind to port 3080 (up to 90s)..."
          for i in {1..45}; do
            if nc -z 127.0.0.1 3080; then
              echo "✅ DeepSeek Harness is up and listening on port 3080!"
              break
            fi
            echo "Waiting... ($i/45)"
            sleep 2
          done

          # Output dsh startup log snippet for verification
          cat dsh.log

      - name: 🚀 Launch ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. Authenticate ngrok
          npx ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # 2. Launch tunnel pointing to 127.0.0.1:3080 using a dynamic ephemeral endpoint
          npx ngrok http 127.0.0.1:3080 --log=stdout > ngrok.log 2>&1 &

          echo "Waiting for ngrok tunnel to initialize..."
          sleep 6

          # 3. Extract generated https URL from ngrok local API
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "=================================================================="
          echo "🚀 YOUR DEEPSEEK HARNESS URL IS:"
          echo "👉 $URL"
          echo "=================================================================="

          # 4. Output directly to the GitHub Actions Job Summary UI
          echo "### 🚀 DeepSeek Harness Web UI" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open DeepSeek Harness]($URL)" >> $GITHUB_STEP_SUMMARY

          # Keep runner alive to preserve active session/tunnel
          tail -f ngrok.log
          
