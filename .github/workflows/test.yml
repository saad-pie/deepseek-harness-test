name: Run Ephemeral DSH Server (ngrok)

on:
  workflow_dispatch: # Trigger manually from Actions tab

jobs:
  run-dsh:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by dsh)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚡ Install & Start DeepSeek Harness
        run: |
          npm install -g @deepseek-ai/dsh@latest
          # Start DSH server in the background on port 3080
          dsh web --port 3080 --no-open &
          sleep 5

      - name: 🚀 Setup & Launch ngrok Tunnel
        uses: ngrok/ngrok-action@v2
        with:
          authtoken: ${{ secrets.NGROK_AUTHTOKEN }}
          port: 3080

      - name: 🌐 Output Access Link
        run: |
          # Fetch the public URL from local ngrok API
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "=================================================================="
          echo "🚀 YOUR DEEPSEEK HARNESS URL IS:"
          echo "👉 $URL"
          echo "=================================================================="

          # Output directly to the GitHub Actions Job Summary UI
          echo "### 🚀 DeepSeek Harness Web UI" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open DeepSeek Harness]($URL)" >> $GITHUB_STEP_SUMMARY

          # Keep runner alive to preserve active tunnel session
          sleep 21600
          
