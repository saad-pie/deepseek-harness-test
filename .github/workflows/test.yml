name: Run Ephemeral DSH Server (ngrok)

on:
  workflow_dispatch: # Trigger manually from Actions tab

jobs:
  run-dsh:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by dsh)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚡ Install & Start DeepSeek Harness
        run: |
          npm install -g @ngrok/ngrok@latest

          # 1. Create workspace directory
          mkdir -p /home/runner/work/workspace
          cd /home/runner/work/workspace

          # 2. Launch DSH via npx so all plugins load cleanly without global resolution failures
          npx -y @deepseek-ai/dsh@latest web --port 3080 --no-open &
          sleep 8

      - name: 🚀 Launch ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. Authenticate ngrok using the npm-installed binary
          npx ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # 2. Launch tunnel pointing to 127.0.0.1:3080
          npx ngrok http 127.0.0.1:3080 --log=stdout > ngrok.log 2>&1 &
          
          echo "Waiting for ngrok tunnel to initialize..."
          sleep 5

          # 3. Extract generated https URL from ngrok local API
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "=================================================================="
          echo "🚀 YOUR DEEPSEEK HARNESS URL IS:"
          echo "👉 $URL"
          echo "=================================================================="

          # 4. Output directly to the GitHub Actions Job Summary UI
          echo "### 🚀 DeepSeek Harness Web UI" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open DeepSeek Harness]($URL)" >> $GITHUB_STEP_SUMMARY

          # Keep runner alive to preserve active session/tunnel
          tail -f ngrok.log
          
